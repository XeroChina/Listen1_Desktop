name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 同 build-win：必须显式在 app 目录安装，否则运行时依赖会被漏掉
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
        working-directory: app

      - name: Verify app dependencies
        run: |
          $mods = @('electron-store','electron-updater','@electron/remote','chardet','music-metadata')
          foreach ($m in $mods) {
            if (-not (Test-Path "app/node_modules/$m")) { Write-Error "missing app dependency: $m"; exit 1 }
            Write-Host "ok: $m"
          }

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.github_token }}

      - name: Verify packaged dependencies
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const b = fs.readFileSync("dist/win-unpacked/resources/app.asar");
            const hss = b.readUInt32LE(4);
            const hdr = b.toString("utf8", 8, 8 + hss);
            const obj = JSON.parse(hdr.slice(hdr.indexOf("{"), hdr.lastIndexOf("}") + 1));
            const has = (o, path) => path.split("/").every((s) => (o = o.files && o.files[s]) !== undefined);
            for (const m of ["electron-store","electron-updater","@electron/remote","chardet","music-metadata"]) {
              if (!has(obj.files.node_modules, m)) { console.error("asar missing dependency: " + m); process.exit(1); }
              console.log("asar ok: " + m);
            }
          '

      - name: Build portable package
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/build-portable.ps1 -AppDir dist/win-unpacked -Version $v -Arch x64

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: listen1-win-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/*portable.zip
          if-no-files-found: warn
